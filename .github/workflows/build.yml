name: Build Project

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneLinux64
            os: ubuntu-latest
          - targetPlatform: StandaloneWindows64
            os: windows-latest
          - targetPlatform: StandaloneOSX
            os: macos-latest
          - targetPlatform: WebGL
            os: ubuntu-latest

    steps:
      - name: Delete unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true

      - name: Prepare artifact
        run: |
          mkdir -p artifact/${{ matrix.targetPlatform }}
          cp -r build/${{ matrix.targetPlatform }}/* artifact/${{ matrix.targetPlatform }}/
          cp README.md artifact/${{ matrix.targetPlatform }}/
          cp config.README.md artifact/${{ matrix.targetPlatform }}/
          cp config.json artifact/${{ matrix.targetPlatform }}/

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: artifact/${{ matrix.targetPlatform }}
