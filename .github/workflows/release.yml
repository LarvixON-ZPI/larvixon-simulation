name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        required: false
        default: false
      build_ref:
        description: "Git ref to build from (branch, tag, or commit SHA)"
        required: false
        default: ""

jobs:
  # Use existing build workflow but with release-specific packaging
  build:
    name: Build ${{ matrix.targetPlatform }} for Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneLinux64
          - StandaloneWindows64
          - StandaloneOSX
          - WebGL

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}

      # Cache
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      # Build
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true

      # Copy README files to build directory
      - name: Copy README files
        run: |
          mkdir -p build/${{ matrix.targetPlatform }}/
          if [ -f "README.md" ]; then
            cp README.md build/${{ matrix.targetPlatform }}/
          fi
          if [ -f "config.README.md" ]; then
            cp config.README.md build/${{ matrix.targetPlatform }}/
          fi

      # Create platform-specific archive for release (tar.gz for all)
      - name: Create release archive
        run: |
          cd build
          case "${{ matrix.targetPlatform }}" in
            StandaloneLinux64)
              tar -czf ../larvixon-simulation-linux.tar.gz ${{ matrix.targetPlatform }}/
              ;;
            StandaloneWindows64)
              tar -czf ../larvixon-simulation-windows.tar.gz ${{ matrix.targetPlatform }}/
              ;;
            StandaloneOSX)
              tar -czf ../larvixon-simulation-macos.tar.gz ${{ matrix.targetPlatform }}/
              ;;
            WebGL)
              tar -czf ../larvixon-simulation-webgl.tar.gz ${{ matrix.targetPlatform }}/
              ;;
          esac

      # Upload release artifacts
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release-${{ matrix.targetPlatform }}
          path: larvixon-simulation-*.tar.gz

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: always() && (needs.build.result == 'success')

    steps:
      # Checkout for release notes
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog generation

      # Download all build artifacts
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      # Organize artifacts
      - name: Organize release files
        run: |
          mkdir -p release-files
          find ./artifacts -name "*.tar.gz" -o -name "*.zip" | while read file; do
            cp "$file" release-files/
          done
          ls -la release-files/

      # Get version from tag or input
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # Generate changelog from commits
      - name: Generate changelog
        id: changelog
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # For tag-based releases, get commits since last tag
            LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              CHANGELOG=$(git log --pretty=format:"- %s (%h)" $LAST_TAG..HEAD)
            else
              CHANGELOG=$(git log --pretty=format:"- %s (%h)" -10)
            fi
          else
            # For manual releases, get recent commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" -10)
          fi
          echo "## Changes" > changelog.md
          echo "" >> changelog.md
          echo "$CHANGELOG" >> changelog.md
          echo "" >> changelog.md
          echo "## Platforms" >> changelog.md
          echo "- 🐧 Linux (tar.gz)" >> changelog.md
          echo "- 🪟 Windows (zip)" >> changelog.md
          echo "- 🍎 macOS (zip)" >> changelog.md
          echo "- 🌐 WebGL (zip)" >> changelog.md

      # Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Larvixon Simulation ${{ steps.version.outputs.version }}
          body_path: changelog.md
          files: release-files/*
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
