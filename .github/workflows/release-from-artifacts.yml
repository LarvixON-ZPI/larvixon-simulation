name: Release from Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release from Latest Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog generation

      - name: Download latest build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Build-*
          path: ./artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release archives
        run: |
          mkdir -p release-files
          if [ -d "./artifacts" ]; then
            for artifact_dir in ./artifacts/Build-*/; do
              if [ -d "$artifact_dir" ]; then
                platform_name=$(basename "$artifact_dir" | sed 's/Build-//')
                echo "Processing $platform_name"
                
                archive_name=""
                case "$platform_name" in
                  StandaloneLinux64)
                    archive_name="larvixon-simulation-linux.tar.gz"
                    ;;
                  StandaloneWindows64)
                    archive_name="larvixon-simulation-windows.tar.gz"
                    ;;
                  StandaloneOSX)
                    archive_name="larvixon-simulation-macos.tar.gz"
                    ;;
                  WebGL)
                    archive_name="larvixon-simulation-webgl.tar.gz"
                    ;;
                esac

                if [ -n "$archive_name" ]; then
                  tar -czf "./release-files/$archive_name" -C "$artifact_dir" .
                fi
              fi
            done
          else
            echo "No artifacts found to archive."
            exit 1
          fi

          echo "Release files created:"
          ls -la release-files/

      - name: Generate changelog body
        id: changelog
        run: |
          CHANGELOG_BODY=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD)
          {
            echo "changelog_text<<EOF"
            echo "## Changes"
            echo ""
            echo "$CHANGELOG_BODY"
            echo ""
            echo "## Platforms"
            echo "- 🐧 Linux (.tar.gz)"
            echo "- 🪟 Windows (.tar.gz)"
            echo "- 🍎 macOS (.tar.gz)"
            echo "- 🌐 WebGL (.tar.gz)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Larvixon Simulation ${{ github.event.inputs.version }}
          body: ${{ steps.changelog.outputs.changelog_text }}
          files: release-files/*
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
